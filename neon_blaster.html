<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Blaster</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #050510; color: white; font-family: Arial, sans-serif;
    display: flex; justify-content: center; align-items: center; min-height: 100vh;
    overflow: hidden;
  }
  #wrap { text-align: center; }
  canvas {
    border: 2px solid #5cf; border-radius: 12px; background: #070719;
    box-shadow: 0 0 30px #09f8; max-width: 95vw; max-height: 82vh;
  }
  p { margin: 8px 0; color: #bde; font-size: 14px; }
  kbd { padding: 3px 7px; border: 1px solid #789; border-radius: 5px; background:#15152a; }
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="900" height="600"></canvas>
<p><kbd>WASD</kbd>/<kbd>Arrows</kbd> move · <kbd>Space</kbd> shoot · <kbd>P</kbd> pause · <kbd>Enter</kbd> start/restart</p>
</div>
<script>
const c = document.getElementById("game"), ctx = c.getContext("2d");
const W=c.width,H=c.height;
const keys={}; let state="menu", score=0, lives=3, level=1, spawn=0, shot=0, power=0, shake=0;
let player, bullets=[], enemies=[], particles=[], stars=[], powerups=[];

for(let i=0;i<110;i++) stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+.4,v:Math.random()*1.5+.3});

function reset(){
  state="playing"; score=0; lives=3; level=1; spawn=0; shot=0; power=0;
  bullets=[]; enemies=[]; particles=[]; powerups=[];
  player={x:W/2,y:H-70,w:34,h:28,speed:5,cool:0,inv:0};
}
function burst(x,y,n=15,col="#5cf"){
  for(let i=0;i<n;i++){
    let a=Math.random()*Math.PI*2, sp=Math.random()*5+1;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:25+Math.random()*25,col});
  }
}
function shoot(){
  if(player.cool>0)return;
  const spread=power>0?[0,-.13,.13]:[0];
  for(const a of spread) bullets.push({x:player.x,y:player.y-18,vx:Math.sin(a)*6,vy:-10,r:4});
  player.cool=power>0?7:11;
}
function spawnEnemy(){
  const type=Math.random()<.18?"tank":"normal";
  enemies.push({
    x:30+Math.random()*(W-60), y:-30, r:type==="tank"?22:16,
    hp:type==="tank"?3:1, max:type==="tank"?3:1,
    vy:(type==="tank"?1.3:2)+level*.08, vx:(Math.random()-.5)*1.2,
    type
  });
}
function update(){
  for(const s of stars){s.y+=s.v;if(s.y>H)s.y=0;s.x+=Math.sin(s.y/60)*.15;}
  if(state!=="playing") return;
  level=1+Math.floor(score/500);
  if(player.inv>0)player.inv--; if(player.cool>0)player.cool--; if(power>0)power--;
  if(shake>0)shake--;
  let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);
  let dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);
  player.x=Math.max(20,Math.min(W-20,player.x+dx*player.speed));
  player.y=Math.max(H*.55,Math.min(H-25,player.y+dy*player.speed));
  if(keys[" "]||keys.Space)shoot();

  spawn--; if(spawn<=0){spawn=Math.max(18,48-level*2);spawnEnemy();}
  for(const b of bullets){b.x+=b.vx;b.y+=b.vy;}
  bullets=bullets.filter(b=>b.y>-20&&b.x>-20&&b.x<W+20);

  for(const e of enemies){e.y+=e.vy;e.x+=e.vx;if(e.x<e.r||e.x>W-e.r)e.vx*=-1;}
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.y>H+30){enemies.splice(i,1); damage();continue;}
    for(let j=bullets.length-1;j>=0;j--){
      const b=bullets[j], d=Math.hypot(b.x-e.x,b.y-e.y);
      if(d<e.r+b.r){
        bullets.splice(j,1); e.hp--; burst(b.x,b.y,5,"#fff");
        if(e.hp<=0){
          score+=e.type==="tank"?100:50; burst(e.x,e.y,e.type==="tank"?28:16,e.type==="tank"?"#f65":"#5cf");
          if(Math.random()<.08) powerups.push({x:e.x,y:e.y,t:"power"});
          enemies.splice(i,1);
        }
        break;
      }
    }
  }
  for(let i=powerups.length-1;i>=0;i--){
    const p=powerups[i];p.y+=2;
    if(Math.hypot(p.x-player.x,p.y-player.y)<28){power=600;powerups.splice(i,1);burst(p.x,p.y,20,"#ff5");}
    else if(p.y>H)powerups.splice(i,1);
  }
  for(const e of enemies){
    if(player.inv<=0 && Math.hypot(e.x-player.x,e.y-player.y)<e.r+18){enemies.splice(enemies.indexOf(e),1);damage();break;}
  }
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.98;p.vy*=.98;p.life--;if(p.life<=0)particles.splice(i,1);}
}
function damage(){
  if(player.inv>0)return;
  lives--; player.inv=90; shake=15; burst(player.x,player.y,25,"#f55");
  if(lives<=0)state="gameover";
}
function draw(){
  ctx.save();
  if(shake)ctx.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
  ctx.fillStyle="#070719";ctx.fillRect(0,0,W,H);
  for(const s of stars){ctx.fillStyle=`rgba(160,220,255,${.3+s.s/3})`;ctx.fillRect(s.x,s.y,s.s,s.s*2);}
  for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/40);ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,3,3);}
  ctx.globalAlpha=1;

  if(state==="playing"||state==="paused"||state==="gameover"){
    // player
    if(player.inv%10<6){
      ctx.fillStyle="#5cf";ctx.beginPath();ctx.moveTo(player.x,player.y-20);ctx.lineTo(player.x-18,player.y+15);ctx.lineTo(player.x,player.y+8);ctx.lineTo(player.x+18,player.y+15);ctx.closePath();ctx.fill();
      ctx.fillStyle="#fff";ctx.fillRect(player.x-3,player.y+8,6,8);
    }
    for(const b of bullets){ctx.fillStyle="#fff";ctx.fillRect(b.x-2,b.y-8,4,12);}
    for(const e of enemies){
      ctx.fillStyle=e.type==="tank"?"#f65":"#d35cff";ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#111";ctx.beginPath();ctx.arc(e.x-6,e.y-2,3,0,7);ctx.arc(e.x+6,e.y-2,3,0,7);ctx.fill();
      if(e.max>1){ctx.fillStyle="#222";ctx.fillRect(e.x-20,e.y-e.r-9,40,4);ctx.fillStyle="#5f5";ctx.fillRect(e.x-20,e.y-e.r-9,40*(e.hp/e.max),4);}
    }
    for(const p of powerups){ctx.fillStyle="#ff5";ctx.beginPath();ctx.arc(p.x,p.y,10,0,7);ctx.fill();ctx.fillStyle="#111";ctx.font="bold 13px Arial";ctx.textAlign="center";ctx.fillText("P",p.x,p.y+5);}
    ctx.textAlign="left";ctx.fillStyle="#fff";ctx.font="bold 20px Arial";ctx.fillText(`SCORE ${score}`,20,32);
    ctx.fillText(`LIVES ${"♥".repeat(lives)}`,20,58);
    ctx.textAlign="right";ctx.fillText(`LEVEL ${level}`,W-20,32);
    if(power>0){ctx.fillStyle="#ff5";ctx.fillText("TRIPLE SHOT",W-20,58);}
  }
  if(state==="menu"){overlay("NEON BLASTER","Press ENTER to start","Destroy enemies. Survive. Get the high score!");}
  if(state==="paused"){overlay("PAUSED","Press P to resume","");}
  if(state==="gameover"){overlay("GAME OVER",`Score: ${score}`,"Press ENTER to play again");}
  ctx.restore();
}
function overlay(title,line,sub){
  ctx.fillStyle="rgba(0,0,20,.72)";ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";ctx.fillStyle="#5cf";ctx.font="bold 58px Arial";ctx.fillText(title,W/2,H/2-50);
  ctx.fillStyle="#fff";ctx.font="bold 25px Arial";ctx.fillText(line,W/2,H/2+5);
  ctx.fillStyle="#abc";ctx.font="18px Arial";ctx.fillText(sub,W/2,H/2+45);
}
function loop(){update();draw();requestAnimationFrame(loop);}
addEventListener("keydown",e=>{
  keys[e.key]=true;
  if(e.key==="Enter"&&(state==="menu"||state==="gameover"))reset();
  if(e.key.toLowerCase()==="p"&&state!=="gameover"&&state!=="menu")state=state==="paused"?"playing":"paused";
});
addEventListener("keyup",e=>keys[e.key]=false);
loop();
</script>
</body>
</html>
